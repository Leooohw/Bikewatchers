name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Mapbox token
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          # Strip stray whitespace/newlines that can sneak in when pasting the secret
          export MAPBOX_TOKEN="$(printf '%s' "$MAPBOX_TOKEN" | tr -d '[:space:]')"
          if [ -z "$MAPBOX_TOKEN" ]; then
            echo "MAPBOX_TOKEN secret is not set" >&2
            exit 1
          fi
          perl -pi -e 's/__MAPBOX_TOKEN__/$ENV{MAPBOX_TOKEN}/g' map.js
          if grep -q "__MAPBOX_TOKEN__" map.js; then
            echo "Token placeholder was not replaced" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
