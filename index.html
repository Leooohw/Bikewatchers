<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bikewatchers</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="map.css" />
    <script src="map.js" type="module"></script>
  </head>
  <body>
    <header>
      <div class="title-block">
        <h1>Bikewatchers</h1>
        <p class="subtitle">
          Bluebikes traffic across Boston and Cambridge in March 2024. Circle
          size shows total trips at each station; color shows whether a station
          sees more departures or arrivals.
        </p>
      </div>
      <label class="time-filter">
        <span class="time-filter-title">Filter by time</span>
        <span class="time-readout">
          <time id="selected-time"></time>
          <em id="any-time">(any time)</em>
        </span>
        <input id="time-slider" type="range" min="-1" max="1440" value="-1" />
        <span class="slider-ticks" aria-hidden="true">
          <span>12 AM</span><span>6 AM</span><span>12 PM</span><span>6 PM</span
          ><span>12 AM</span>
        </span>
      </label>
    </header>
    <div id="map">
      <svg></svg>
    </div>
    <div id="tooltip"></div>

    <div class="legend">
      <span class="legend-title">Legend:</span>
      <div style="--departure-ratio: 1">More departures</div>
      <div style="--departure-ratio: 0.5">Balanced</div>
      <div style="--departure-ratio: 0">More arrivals</div>
    </div>
  </body>
</html>
